    <script>
        // ======================= FIREBASE CONFIG =======================
        const firebaseConfig = {
            apiKey: "AIzaSyCCjWVI1hB3sbu0JiA4viW1BK81xbMML-U",
            authDomain: "csl-calculations.firebaseapp.com",
            projectId: "csl-calculations",
            storageBucket: "csl-calculations.firebasestorage.app",
            messagingSenderId: "887219643486",
            appId: "1:887219643486:web:0cb001f2c72039a00240cf"
        };

        let db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (err) {
            console.log("Firebase error:", err);
        }

        // ======================= HOLIDAYS & SHIFTS =======================
        const holidays2025 = {
            "2025-08-15": "Independence Day",
            "2025-09-04": "First Onam",
            "2025-09-05": "Thiruvonam",
            "2025-09-06": "Third Onam",
            "2025-10-02": "Gandhi Jayanthi / Vijayadasami",
            "2025-10-20": "Deepavali",
            "2025-12-25": "Christmas"
        };

        const holidays2026 = {
            "2026-01-26": "Republic Day",
            "2026-03-20": "Id-ul-Fitr (Ramzan)",
            "2026-04-03": "Good Friday",
            "2026-04-09": "Vote",
            "2026-04-14": "Ambedkar Jayanti",
            "2026-04-15": "Vishu",
            "2026-05-01": "May Day",
            "2026-05-27": "Id-ul-Ad'ha (Bakrid)",
            "2026-08-15": "Independence Day",
            "2026-08-26": "Thiruvonam",
            "2026-08-28": "Fourth Onam Sree Narayana Ayyankali Jayanthi",
            "2026-10-02": "Gandhi Jayanthi",
            "2026-10-21": "Vijayadasami",
            "2026-12-25": "Christmas"
        };

        const shiftTimes = {
            "A2": { start: "07:00", end: "15:20" },
            "B2": { start: "13:40", end: "22:00" },
            "C2": { start: "06:00", end: "14:00" },
            "C1": { start: "08:00", end: "16:20" }
        };

        // ======================= STATE & STORAGE =======================
        const today = new Date();
        let currentYear = today.getFullYear();
        let currentMonth = today.getMonth();
        
        let attendanceData = {};
        let employeeData = {
            name: '', code: '', 
            clTotal: 0, elTotal: 0, hplTotal: 0, specialTotal: 3, 
            lastUpdate: "2025-12-01",
            lastIncrementDate: "2025-12-01",
            settingsUpdated: false, userId: '', lastSync: 0
        };

        try {
            attendanceData = JSON.parse(localStorage.getItem('attendanceData')) || {};
            const storedEmp = JSON.parse(localStorage.getItem('employeeData'));
            if (storedEmp && typeof storedEmp === 'object') {
                employeeData = storedEmp;
            }
        } catch (e) {
            console.warn("Storage error:", e);
        }
        
        // Backward compatibility
        if (employeeData.cl !== undefined) { employeeData.clTotal = employeeData.cl || 0; delete employeeData.cl; }
        if (employeeData.el !== undefined) { employeeData.elTotal = employeeData.el || 0; delete employeeData.el; }
        if (employeeData.hpl !== undefined) { employeeData.hplTotal = employeeData.hpl || 0; delete employeeData.hpl; }
        if (employeeData.special !== undefined) { employeeData.specialTotal = employeeData.special || 0; delete employeeData.special; }

        employeeData.clTotal = employeeData.clTotal || 0;
        employeeData.elTotal = employeeData.elTotal || 0;
        employeeData.hplTotal = employeeData.hplTotal || 0;
        employeeData.specialTotal = employeeData.specialTotal || 0;
        employeeData.lastUpdate = employeeData.lastUpdate || "2025-12-01";
        if (!employeeData.lastIncrementDate) employeeData.lastIncrementDate = employeeData.lastUpdate;
        
        let syncInProgress = false;
        let pendingAction = null;
        let cachedBalance = null;
        let cachedMonthKey = null;

        // ======================= HELPER FUNCTIONS =======================
        function getMonthKey(year, month) {
            return year + '-' + String(month + 1).padStart(2, '0');
        }

        // Clean leave string matching
        function normalizeLeaveType(type) {
            if (!type) return '';
            const t = type.toString().toUpperCase().trim();
            if (t === 'CL') return 'CL';
            if (t === 'EL') return 'EL';
            if (t === 'HPL') return 'HPL';
            if (t === 'SPECIAL' || t === 'SPL') return 'SPECIAL';
            return '';
        }

        function getLeaveDeduction(leaveType, halfDay) {
            const norm = normalizeLeaveType(leaveType);
            let base = halfDay === 'Yes' ? 0.5 : 1;
            if (norm === 'HPL') return base * 2;
            return base;
        }

        function calculateUsedLeavesForMonth(year, month) {
            let used = { cl: 0, el: 0, hpl: 0, special: 0 };
            const monthKey = getMonthKey(year, month);
            for (let dateStr in attendanceData) {
                if (dateStr.indexOf(monthKey) !== 0) continue;
                const d = attendanceData[dateStr];
                if (!d || !d.leave) continue;
                const norm = normalizeLeaveType(d.leave);
                const deduction = getLeaveDeduction(norm, d.halfDay);
                if (norm === 'CL') used.cl += deduction;
                else if (norm === 'EL') used.el += deduction;
                else if (norm === 'HPL') used.hpl += deduction;
                else if (norm === 'SPECIAL') used.special += deduction;
            }
            return used;
        }

        function calculateBalanceAtMonthStart(year, month) {
            let remaining = {
                cl: parseFloat(employeeData.clTotal) || 0,
                el: parseFloat(employeeData.elTotal) || 0,
                hpl: parseFloat(employeeData.hplTotal) || 0,
                special: parseInt(employeeData.specialTotal) || 0
            };
            const targetMonthKey = getMonthKey(year, month);
            for (let dateStr in attendanceData) {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) continue;
                const recordMonthKey = getMonthKey(date.getFullYear(), date.getMonth());
                if (recordMonthKey < targetMonthKey) {
                    const d = attendanceData[dateStr];
                    if (!d || !d.leave) continue;
                    const norm = normalizeLeaveType(d.leave);
                    const deduction = getLeaveDeduction(norm, d.halfDay);
                    if (norm === 'CL') remaining.cl = Math.max(0, remaining.cl - deduction);
                    else if (norm === 'EL') remaining.el = Math.max(0, remaining.el - deduction);
                    else if (norm === 'HPL') remaining.hpl = Math.max(0, remaining.hpl - deduction);
                    else if (norm === 'SPECIAL') remaining.special = Math.max(0, remaining.special - deduction);
                }
            }
            return remaining;
        }

        function getLeaveBalanceForCurrentMonth() {
            const monthKey = getMonthKey(currentYear, currentMonth);
            if (cachedBalance && cachedMonthKey === monthKey) {
                return cachedBalance;
            }
            const startingBalance = calculateBalanceAtMonthStart(currentYear, currentMonth);
            const usedThisMonth = calculateUsedLeavesForMonth(currentYear, currentMonth);
            const balance = {
                cl: Math.max(0, startingBalance.cl - usedThisMonth.cl),
                el: Math.max(0, startingBalance.el - usedThisMonth.el),
                hpl: Math.max(0, startingBalance.hpl - usedThisMonth.hpl),
                special: Math.max(0, startingBalance.special - usedThisMonth.special)
            };
            cachedBalance = balance;
            cachedMonthKey = monthKey;
            return balance;
        }

        function invalidateBalanceCache() {
            cachedBalance = null;
            cachedMonthKey = null;
        }

        // ======================= EL AUTO-INCREMENT =======================
        function updateEarnedLeave() {
            const todayDate = new Date();
            const lastIncDate = new Date(employeeData.lastIncrementDate);
            let monthsDiff = (todayDate.getFullYear() - lastIncDate.getFullYear()) * 12 + 
                             (todayDate.getMonth() - lastIncDate.getMonth());
            if (monthsDiff > 0) {
                employeeData.elTotal = (parseFloat(employeeData.elTotal) || 0) + (monthsDiff * 2.5);
                const newIncDate = new Date(todayDate.getFullYear(), todayDate.getMonth(), 1);
                employeeData.lastIncrementDate = newIncDate.toISOString().split('T')[0];
                employeeData.lastUpdate = todayDate.toISOString().split('T')[0];
                try {
                    localStorage.setItem('employeeData', JSON.stringify(employeeData));
                } catch(e) {}
                invalidateBalanceCache();
            }
        }

        // ======================= HOLIDAY / WEEKEND HELPERS =======================
        function getWeekendDates(year) {
            const weekends = [];
            for (let month = 0; month < 12; month++) {
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                let secondSat = null, fourthSat = null, satCount = 0;
                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    if (date.getDay() === 6) {
                        satCount++;
                        if (satCount === 2) secondSat = day;
                        if (satCount === 4) fourthSat = day;
                    }
                }
                if (secondSat) weekends.push(year + '-' + String(month + 1).padStart(2, '0') + '-' + String(secondSat).padStart(2, '0'));
                if (fourthSat) weekends.push(year + '-' + String(month + 1).padStart(2, '0') + '-' + String(fourthSat).padStart(2, '0'));
            }
            return weekends;
        }

        const weekends2025 = getWeekendDates(2025);
        const weekends2026 = getWeekendDates(2026);

        function isHoliday(dateStr, dayOfWeek) {
            if (dayOfWeek === 0) return true;
            const holidays = currentYear === 2025 ? holidays2025 : holidays2026;
            const weekends = currentYear === 2025 ? weekends2025 : weekends2026;
            return holidays[dateStr] || (weekends.indexOf(dateStr) !== -1);
        }

        function packDayData(dayData) {
            if (!dayData) return "";
            return [
                dayData.shift || "",
                dayData.inPunch || "",
                dayData.outPunch || "",
                dayData.ot || "0",
                dayData.leave || "",
                dayData.halfDay || "No"
            ].join("|");
        }

        function unpackDayData(packedString) {
            if (!packedString) return null;
            const parts = packedString.split("|");
            return {
                shift: parts[0] || "",
                inPunch: parts[1] || "",
                outPunch: parts[2] || "",
                ot: parseFloat(parts[3]) || 0,
                leave: parts[4] || "",
                halfDay: parts[5] || "No"
            };
        }

        function packMonthData(data, year, month) {
            const packed = {};
            const monthStr = getMonthKey(year, month);
            for (const dateStr in data) {
                if (dateStr.indexOf(monthStr) === 0) packed[dateStr] = packDayData(data[dateStr]);
            }
            return packed;
        }

        function unpackMonthData(packedMonthData) {
            const unpacked = {};
            for (const dateStr in packedMonthData) {
                const dayData = unpackDayData(packedMonthData[dateStr]);
                if (dayData) unpacked[dateStr] = dayData;
            }
            return unpacked;
        }

        function formatTimeFromHours(decimalHours) {
            if (!decimalHours || isNaN(decimalHours)) return '';
            const hours = Math.floor(decimalHours);
            const minutes = Math.round((decimalHours - hours) * 60);
            return hours + '.' + String(minutes).padStart(2, '0');
        }

        function parseTimeToHours(timeStr) {
            if (!timeStr) return 0;
            timeStr = timeStr.trim();
            if (/^\d+$/.test(timeStr)) return parseFloat(timeStr);
            timeStr = timeStr.replace(':', '.');
            const parts = timeStr.split('.');
            const hours = Number(parts[0]);
            const minutes = parts[1] !== undefined ? Number(parts[1]) : 0;
            if (isNaN(hours)) return 0;
            return isNaN(minutes) ? hours : hours + (minutes / 60);
        }

        // ======================= CALENDAR RENDERING =======================
        function showMonth(month) {
            let newYear = currentYear, newMonth = month;
            if (month < 0) { newMonth = 11; newYear = currentYear - 1; }
            else if (month > 11) { newMonth = 0; newYear = currentYear + 1; }
            else { newMonth = month; }
            if (newYear < 2025) newYear = 2025;
            if (newYear > 2026) newYear = 2026;
            currentYear = newYear;
            currentMonth = newMonth;
            
            let calendarHTML = '';
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const monthName = new Date(currentYear, currentMonth).toLocaleString('default', { month: 'long' });

            calendarHTML += `
                <div class="month-container">
                    <button class="month-nav-btn" onclick="showMonth(currentMonth - 1)">&larr;</button>
                    <span>${monthName} ${currentYear}</span>
                    <button class="month-nav-btn" onclick="showMonth(currentMonth + 1)">&rarr;</button>
                </div>
                <div class="week-header">
                    <div>Sun</div><div>Mon</div><div>Tue</div>
                    <div>Wed</div><div>Thu</div><div>Fri</div>
                    <div>Sat</div>
                </div>
                <div class="calendar-body">
            `;

            let date = 1;
            for (let i = 0; i < 6; i++) {
                if (date > daysInMonth) break;
                calendarHTML += '<div class="week">';
                for (let j = 0; j < 7; j++) {
                    if ((i === 0 && j < firstDay) || date > daysInMonth) {
                        calendarHTML += '<div class="day" style="background:#f8fafc;border-color:transparent;"></div>';
                    } else {
                        const dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(date).padStart(2, '0');
                        let classes = 'day';
                        if (isHoliday(dateStr, j)) classes += ' holiday';
                        if (today.getFullYear() === currentYear && today.getMonth() === currentMonth && today.getDate() === date) {
                            classes += ' today';
                        }
                        const dayData = attendanceData[dateStr];
                        if (dayData) {
                            if (dayData.leave) {
                                const leaveType = dayData.leave.toLowerCase();
                                if (dayData.halfDay === 'Yes') classes += ' half-day half-day-' + leaveType;
                                else classes += ' leave leave-' + leaveType;
                            } else if (dayData.inPunch && dayData.outPunch) classes += ' present-full';
                            else if (dayData.inPunch) classes += ' present-in';
                        }
                        
                        let otDisplay = '';
                        if (dayData && dayData.ot && dayData.ot != 0) {
                            otDisplay = '<span class="ot-display">' + formatTimeFromHours(dayData.ot) + 'h</span>';
                        }

                        calendarHTML += '<div class="' + classes + '" onclick="showAttendancePopup(\'' + dateStr + '\')">' + date + otDisplay + '</div>';
                        date++;
                    }
                }
                calendarHTML += '</div>';
            }
            calendarHTML += '</div>';
            
            const calendarContainer = document.getElementById('calendar-container');
            if (calendarContainer) {
                calendarContainer.innerHTML = calendarHTML;
                updateSummaryBox();
            }
        }

        function updateSummaryBox() {
            let totalOT = 0, quarterlyOT = 0, nextMonthTotalOT = 0, presentDays = 0;
            const prevMonth = (currentMonth === 0 ? 11 : currentMonth - 1);
            const prevYear = currentMonth === 0 ? currentYear - 1 : currentYear;
            const otStartDate = new Date(prevYear, prevMonth, 20);
            const otEndDate = new Date(currentYear, currentMonth, 20);
            const nextMonthStart = new Date(currentYear, currentMonth, 20);
            const nextMonthEnd = new Date(currentYear, currentMonth + 1, 20);
            const quarter = Math.floor(currentMonth / 3);
            const quarterStartMonth = quarter * 3;
            const quarterEndMonth = quarterStartMonth + 2;
            const quarterStart = new Date(currentYear, quarterStartMonth - 1, 20);
            const quarterEnd = new Date(currentYear, quarterEndMonth, 20);
            let hasNextMonthEntries = false;

            for (let dateStr in attendanceData) {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) continue;
                const otVal = parseFloat(attendanceData[dateStr].ot) || 0;
                if (date >= otStartDate && date < otEndDate) totalOT += otVal;
                if (date >= quarterStart && date < quarterEnd) quarterlyOT += otVal;
                if (date >= nextMonthStart && date < nextMonthEnd) {
                    nextMonthTotalOT += otVal;
                    hasNextMonthEntries = true;
                }
                if (date.getFullYear() === currentYear && date.getMonth() === currentMonth) {
                    const d = attendanceData[dateStr];
                    if (d.inPunch && d.outPunch && !isHoliday(dateStr, date.getDay())) presentDays++;
                }
            }

            const usedThisMonth = calculateUsedLeavesForMonth(currentYear, currentMonth);
            const balThisMonth = getLeaveBalanceForCurrentMonth();
            const otRemaining = 75 - quarterlyOT;
            const otRemainingDisplay = otRemaining >= 0 ? '(-' + otRemaining.toFixed(2) + 'h)' : '(+' + Math.abs(otRemaining).toFixed(2) + 'h)';
            
            let summaryHTML = `
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="label">Monthly OT</div>
                        <div class="val">${formatTimeFromHours(totalOT)} hrs</div>
                    </div>
                    <div class="summary-card">
                        <div class="label">Quarterly OT</div>
                        <div class="val">${formatTimeFromHours(quarterlyOT)} hrs <span class="ot-remaining">${otRemainingDisplay}</span></div>
                    </div>
                    ${hasNextMonthEntries ? `
                    <div class="summary-card full-width">
                        <div class="label">Next Month OT</div>
                        <div class="val">${formatTimeFromHours(nextMonthTotalOT)} hrs</div>
                    </div>` : ''}
                    <div class="summary-card full-width">
                        <div class="label">Leave Status (Used / Balance)</div>
                        <div class="leaves-badge-container">
                            <div class="leave-badge"><div class="lbl">CL</div><div class="count">${usedThisMonth.cl.toFixed(1)} / ${balThisMonth.cl.toFixed(1)}</div></div>
                            <div class="leave-badge"><div class="lbl">EL</div><div class="count">${usedThisMonth.el.toFixed(1)} / ${balThisMonth.el.toFixed(1)}</div></div>
                            <div class="leave-badge"><div class="lbl">HPL</div><div class="count">${usedThisMonth.hpl.toFixed(1)} / ${balThisMonth.hpl.toFixed(1)}</div></div>
                            <div class="leave-badge"><div class="lbl">SPL</div><div class="count">${usedThisMonth.special} / ${balThisMonth.special}</div></div>
                        </div>
                    </div>
                    <div class="summary-card full-width">
                        <div class="label">Present Days</div>
                        <div class="val">${presentDays} Days</div>
                    </div>
                </div>
            `;
            const summaryBox = document.getElementById('summary-box');
            if (summaryBox) summaryBox.innerHTML = summaryHTML;
        }

        // ======================= ATTENDANCE POPUP =======================

            if (data.leave) {

                const restore = getLeaveDeduction(norm, data.halfDay);
                if (norm === 'CL') adjustedBal.cl += restore;
                else if (norm === 'EL') adjustedBal.el += restore;
                else if (norm === 'HPL') adjustedBal.hpl += restore;
                else if (norm === 'SPECIAL') adjustedBal.special += restore;

            let popupHTML = `
                <div class="modal-content">

                            <option value="A2" ${data.shift === 'A2' ? 'selected' : ''}>A2</option>
                            <option value="B2" ${data.shift === 'B2' ? 'selected' : ''}>B2</option>
                            <option value="C2" ${data.shift === 'C2' ? 'selected' : ''}>C2</option>
                            <option value="C1" ${data.shift === 'C1' ? 'selected' : ''}>C1</option>

                        <label for="ot">OT:</label>

                            <option value="EL" ${data.leave === 'EL' ? 'selected' : ''} ${adjustedBal.el <= 0 ? 'disabled' : ''}>EL (${adjustedBal.el.toFixed(1)})</option>
                            <option value="HPL" ${data.leave === 'HPL' ? 'selected' : ''} ${adjustedBal.hpl <= 0 ? 'disabled' : ''}>HPL (${adjustedBal.hpl.toFixed(1)})</option>

                        <select id="halfDay">

                            <option value="Yes" ${data.halfDay === 'Yes' ? 'selected' : ''}>Yes</option>
                        </select>
                    </div>
            `;
            if (!employeeData.settingsUpdated) popupHTML += `<p class="leave-msg">Please initialize leave total in Settings tab</p>`;
            popupHTML += `
                    <div class="btn-group">
                        <button class="btn save-btn" onclick="saveAttendance('${dateStr}')">Save</button>

        function closeAttendancePopup() {
            document.getElementById('attendance-popup').style.display = 'none';
        }

        function updateHalfDayOptions() {
            const leave = document.getElementById('leave').value;
            const halfDaySelect = document.getElementById('halfDay');
            if (leave === 'EL' || leave === 'Special') {
                halfDaySelect.value = 'No';
                halfDaySelect.disabled = true;
            } else {
                halfDaySelect.disabled = false;
            }
        }

        function setDefaultTimes() {
            const shift = document.getElementById('shift').value;
            const inPunch = document.getElementById('inPunch');
            const outPunch = document.getElementById('outPunch');
            if (shift && shiftTimes[shift]) {
                if (!inPunch.value) inPunch.value = shiftTimes[shift].start;
                if (!outPunch.value) outPunch.value = shiftTimes[shift].end;
            }
        }

        function saveAttendance(dateStr) {
            const inPunch = document.getElementById('inPunch').value;
            const outPunch = document.getElementById('outPunch').value;
            const otInput = document.getElementById('ot').value;
            const leave = document.getElementById('leave').value;
            const halfDay = document.getElementById('halfDay').value;
            const shift = document.getElementById('shift').value;
            let ot = parseTimeToHours(otInput);
            
            // Check Available Balance Accurately
            if (leave && leave !== '') {
                const norm = normalizeLeaveType(leave);
                const deductionNeeded = getLeaveDeduction(norm, halfDay);
                const bal = getLeaveBalanceForCurrentMonth();
                const existingData = attendanceData[dateStr] || {};
                
                let currentBalForType = norm === 'CL' ? bal.cl : (norm === 'EL' ? bal.el : (norm === 'HPL' ? bal.hpl : bal.special));
                
                if (existingData.leave) {
                    const existNorm = normalizeLeaveType(existingData.leave);
                    if (existNorm === norm) {
                        currentBalForType += getLeaveDeduction(existNorm, existingData.halfDay);
                    }
                }

                if (currentBalForType < deductionNeeded) {
                    showAlert("Insufficient " + leave + " balance remaining!", "Leave Warning");
                    return;
                }
            }

            attendanceData[dateStr] = { inPunch, outPunch, ot, leave, halfDay, shift };
            try {
                localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
            } catch(e) {}
            
            invalidateBalanceCache();
            closeAttendancePopup();
            showMonth(currentMonth);
            updateSyncStatus('Changes pending');
            setTimeout(() => autoSyncCurrentMonth(), 1000);
            updateSummaryBox();
        }

        // ======================= CLOUD SYNC =======================
        async function autoSyncCurrentMonth() {
            if (!db || !employeeData.userId) return false;
            const monthKey = getMonthKey(currentYear, currentMonth);
            let lastAutoSync = null;
            try {
                lastAutoSync = localStorage.getItem('lastAutoSync_' + monthKey);
            } catch(e) {}
            
            const now = Date.now();
            if (lastAutoSync && (now - parseInt(lastAutoSync) < 3600000)) return false;
            try {
                updateSyncStatus('Auto-syncing...');
                const docRef = db.collection("attendance_records").doc(employeeData.userId).collection("months").doc(monthKey);
                const doc = await docRef.get();
                let cloudDataLoaded = false;
                if (doc.exists) {
                    const remoteData = doc.data();
                    const remoteTimestamp = remoteData.lastUpdated || 0;
                    let localTimestamp = 0;
                    for (let dateStr in attendanceData) {
                        if (dateStr.indexOf(monthKey) === 0) localTimestamp = Math.max(localTimestamp, remoteTimestamp);
                    }
                    if (remoteTimestamp > localTimestamp) {
                        const unpackedData = unpackMonthData(remoteData.monthData || {});
                        for (let dateStr in unpackedData) attendanceData[dateStr] = unpackedData[dateStr];
                        try {
                            localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
                        } catch(e) {}
                        invalidateBalanceCache();
                        cloudDataLoaded = true;
                    }
                }
                await saveCurrentMonthToCloud();
                try {
                    localStorage.setItem('lastAutoSync_' + monthKey, now.toString());
                } catch(e) {}
                updateSyncStatus('Auto-synced');
                if (cloudDataLoaded) showMonth(currentMonth);
                return true;
            } catch (error) {
                updateSyncStatus('Auto-sync failed');
                return false;
            }
        }

        async function saveCurrentMonthToCloud() {
            if (!db || !employeeData.userId || syncInProgress) return;
            syncInProgress = true;
            const syncBtn = document.getElementById('syncBtn');
            if (syncBtn) syncBtn.disabled = true;
            try {
                updateSyncStatus('Saving...');
                const monthKey = getMonthKey(currentYear, currentMonth);
                const packedMonthData = packMonthData(attendanceData, currentYear, currentMonth);
                await db.collection("attendance_records").doc(employeeData.userId).collection("months").doc(monthKey).set({
                    userId: employeeData.userId,
                    month: monthKey,
                    monthData: packedMonthData,
                    lastUpdated: Date.now()
                });
                updateSyncStatus('Saved to cloud');
                setTimeout(() => updateSyncStatus('Ready'), 2000);
            } catch (error) {
                updateSyncStatus('Save failed');
            } finally {
                syncInProgress = false;
                if (syncBtn) syncBtn.disabled = false;
            }
        }

        async function loadFromCloud() {
            if (!db || !employeeData.userId) { showAlert("Firebase not connected", "Sync Error"); return; }
            try {
                updateSyncStatus('Loading...');
                const snapshot = await db.collection("attendance_records").doc(employeeData.userId).collection("months").get();
                if (snapshot.empty) { updateSyncStatus('No data'); showAlert("No records in cloud database", "Sync Notice"); return; }
                let loadedCount = 0;
                snapshot.forEach(doc => {
                    const monthData = doc.data();
                    const unpackedData = unpackMonthData(monthData.monthData || {});
                    for (let dateStr in unpackedData) attendanceData[dateStr] = unpackedData[dateStr];
                    loadedCount++;
                });
                try {
                    localStorage.setItem('attendanceData', JSON.stringify(attendanceData));
                } catch(e) {}
                invalidateBalanceCache();
                showMonth(currentMonth);
                updateSyncStatus('Loaded (' + loadedCount + 'm)');
                setTimeout(() => updateSyncStatus('Ready'), 2000);
                showAlert('Loaded records for ' + loadedCount + ' months.', "Sync Success");
            } catch (error) {
                updateSyncStatus('Load failed');
                showAlert(error.message, "Sync Error");
            }
        }

        async function saveToCloud() {
            if (!db || !employeeData.userId) { showAlert("Firebase not connected", "Sync Error"); return; }
            syncInProgress = true;
            const syncBtn = document.getElementById('syncBtn');
            if (syncBtn) syncBtn.disabled = true;
            try {
                updateSyncStatus('Saving all...');
                const monthMap = {};
                for (let dateStr in attendanceData) {
                    const monthKey = dateStr.substring(0, 7);
                    if (!monthMap[monthKey]) monthMap[monthKey] = {};
                    monthMap[monthKey][dateStr] = attendanceData[dateStr];
                }
                let savedCount = 0;
                for (let monthKey in monthMap) {
                    const packedMonthData = {};
                    for (let dateStr in monthMap[monthKey]) packedMonthData[dateStr] = packDayData(monthMap[monthKey][dateStr]);
                    await db.collection("attendance_records").doc(employeeData.userId).collection("months").doc(monthKey).set({
                        userId: employeeData.userId,
                        month: monthKey,
                        monthData: packedMonthData,
                        lastUpdated: Date.now()
                    });
                    savedCount++;
                }
                updateSyncStatus('Saved (' + savedCount + 'm)');
                setTimeout(() => updateSyncStatus('Ready'), 2000);
                showAlert('Saved records for ' + savedCount + ' months.', "Sync Success");
            } catch (error) {
                updateSyncStatus('Save failed');
                showAlert(error.message, "Sync Error");
            } finally {
                syncInProgress = false;
                if (syncBtn) syncBtn.disabled = false;
            }
        }

        async function autoSync() {
            if (!db || !employeeData.userId) { showAlert("Cloud connection offline", "Sync Error"); return; }
            if (syncInProgress) return;
            syncInProgress = true;
            updateSyncStatus('Syncing...');
            try {
                await autoSyncCurrentMonth();
                updateSyncStatus('Synced successfully');
                setTimeout(() => updateSyncStatus('Ready'), 2000);
            } catch (error) {
                updateSyncStatus('Sync failed');
                showAlert(error.message, "Sync Error");
            } finally {
                syncInProgress = false;
            }
        }

        function updateSyncStatus(status) {
            const statusElem = document.getElementById('syncStatus');
            if (statusElem) {
                statusElem.textContent = status || 'Offline';
                if (status === 'Ready' || status === 'Synced successfully' || status === 'Auto-synced') statusElem.style.color = '#10b981';
                else if (status.indexOf('...') !== -1) statusElem.style.color = '#f59e0b';
                else if (status.indexOf('failed') !== -1 || status.indexOf('Failed') !== -1) statusElem.style.color = '#ef4444';
                else statusElem.style.color = '#94a3b8';
            }
        }

        // ======================= SETTINGS & PROFILE =======================
        function saveSettings() { showConfirm('saveSettings'); }
        function saveSettingsConfirmed() {
            employeeData.name = document.getElementById('empName').value;
            employeeData.code = document.getElementById('empCode').value;
            employeeData.clTotal = parseFloat(document.getElementById('clBalance').value) || 0;
            employeeData.elTotal = parseFloat(document.getElementById('elBalance').value) || 0;
            employeeData.hplTotal = parseFloat(document.getElementById('hplBalance').value) || 0;
            employeeData.specialTotal = parseInt(document.getElementById('specialLeave').value) || 0;
            employeeData.settingsUpdated = true;
            if (!employeeData.userId) employeeData.userId = generateUserId(employeeData.name, employeeData.code);
            try {
                localStorage.setItem('employeeData', JSON.stringify(employeeData));
            } catch(e) {}
            invalidateBalanceCache();
            showAlert('Settings saved successfully!', "Success");
            loadSettings();
            updateSummaryBox();
            updateSyncStatus('Changes pending');
        }

        function loadSettings() {
            document.getElementById('empName').value = employeeData.name || '';
            document.getElementById('empCode').value = employeeData.code || '';
            document.getElementById('clBalance').value = (employeeData.clTotal || 0).toFixed(1);
            document.getElementById('elBalance').value = (employeeData.elTotal || 0).toFixed(1);
            document.getElementById('hplBalance').value = (employeeData.hplTotal || 0).toFixed(1);
            document.getElementById('specialLeave').value = employeeData.specialTotal || 0;
        }

        function generateUserId(name, code) {
            const cleanName = (name || '').substring(0, 3).toLowerCase().replace(/[^a-z0-9]/g, '');
            const cleanCode = (code || '').replace(/[^a-z0-9]/g, '');
            return (cleanName || 'usr') + '_' + cleanCode;
        }

        function showUserRegisterModal() {
            document.getElementById('userRegisterModal').style.display = 'flex';
        }

        function registerUser() {
            const name = document.getElementById('regName').value.trim();
            const code = document.getElementById('regCode').value.trim();
            if (!name || !code) { showAlert("Please fill out both Name and Code", "Input Error"); return; }
            employeeData.name = name;
            employeeData.code = code;
            employeeData.userId = generateUserId(name, code);
            employeeData.settingsUpdated = true;
            try {
                localStorage.setItem('employeeData', JSON.stringify(employeeData));
            } catch(e) {}
            document.getElementById('userRegisterModal').style.display = 'none';
            loadSettings();
            showMonth(currentMonth);
            updateSyncStatus('Registered');
        }

        function showTab(tab) {
            document.getElementById('calendar-tab').style.display = tab === 'calendar' ? 'block' : 'none';
            document.getElementById('settings-tab').style.display = tab === 'settings' ? 'block' : 'none';
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.querySelector(`.tab-btn[onclick="showTab('${tab}')"]`);
            if (activeBtn) activeBtn.classList.add('active');
            if (tab === 'calendar') updateSummaryBox();
        }

        function generateMonthlyPDF() {
            try {
                const monthName = new Date(currentYear, currentMonth).toLocaleString('default', { month: 'long' });
                let tableData = [];
                let totalLeave = 0, totalOT = 0, totalPresent = 0;
                const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    const data = attendanceData[dateStr] || {};
                    const dateObj = new Date(currentYear, currentMonth, d);
                    const isHol = isHoliday(dateStr, dateObj.getDay());
                    const leaveStr = data.leave ? (data.leave + (data.halfDay === 'Yes' ? ' (Half)' : '')) : (isHol ? 'Holiday' : '');
                    if (data.leave) totalLeave += getLeaveDeduction(data.leave, data.halfDay);
                    else if (data.inPunch && data.outPunch && !isHol) totalPresent += 1;
                    if (data.ot) totalOT += parseFloat(data.ot) || 0;
                    tableData.push({
                        date: dateStr, shift: data.shift || '', inTime: data.inPunch || '',
                        outTime: data.outPunch || '', leave: leaveStr,
                        ot: data.ot ? formatTimeFromHours(data.ot) + ' hrs' : '0',
                        isHoliday: isHol, leaveType: (data.leave || '').toLowerCase()
                    });
                }
                const pdfData = {
                    name: employeeData.name || 'Unknown', code: employeeData.code || 'Unknown',
                    month: monthName + ' ' + currentYear, table: tableData,
                    totalLeave: totalLeave.toFixed(1), totalOT: formatTimeFromHours(totalOT),
                    totalPresent: totalPresent
                };
                const encodedData = encodeURIComponent(JSON.stringify(pdfData));
                window.location.href = `openchrome://vishnuputhur.github.io/cslv2/atnpdf.html?data=${encodedData}`;
            } catch (error) { showAlert('Failed to build PDF payload: ' + error.message, "PDF Error"); }
        }

        // ======================= APP INITIALIZATION =======================
        function initApp() {
            if (!employeeData.name || !employeeData.code) {
                showUserRegisterModal();
                return;
            }
            if (!employeeData.userId) {
                employeeData.userId = generateUserId(employeeData.name, employeeData.code);
                try {
                    localStorage.setItem('employeeData', JSON.stringify(employeeData));
                } catch(e) {}
            }
            updateEarnedLeave();
            loadSettings();
            showMonth(currentMonth);
            updateSyncStatus('Ready');
            setTimeout(() => {
                autoSyncCurrentMonth().catch(e => console.log("Auto-sync silent catch", e));
            }, 600);
        }

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('custom-modal')) e.target.style.display = 'none';
            if (e.target.classList.contains('custom-message-modal')) e.target.style.display = 'none';
        });

        window.addEventListener('DOMContentLoaded', initApp);
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw-atn.js?v=3.4');
      }
    </script>
</body>
